name: CI/CD — Entrega Continua

on:
  push:
    branches:
      - main
      - checkpoint-01
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Gate (Lint, Testes e Cobertura)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar lint com Ruff
        run: ruff check .

      - name: Executar testes e cobertura com Pytest
        run: pytest --cov=app --cov-report=term-missing

  publicar:
    name: Versionar, Construir, Publicar e Release
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      versao: ${{ steps.versao.outputs.versao_limpa }}
      tag_sha: sha-${{ steps.versao.outputs.sha_curto }}
    steps:
      - name: Checkout com historico completo para SemVer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derivar a versao dos Conventional Commits
        id: semver
        uses: paulhatch/semantic-version@v5
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|!)"
          minor_pattern: "^feat(\\(.*\\))?:"
          format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Definir versao e SHA
        id: versao
        run: |
          VERSAO="${{ steps.semver.outputs.version }}"
          SHA_CURTO=$(git rev-parse --short HEAD)
          echo "versao_limpa=${VERSAO}" >> "$GITHUB_OUTPUT"
          echo "sha_curto=${SHA_CURTO}" >> "$GITHUB_OUTPUT"
          echo "Versao derivada: ${VERSAO} (sha-${SHA_CURTO})"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem com tags SemVer e SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.versao.outputs.versao_limpa }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ufla-shop:${{ steps.versao.outputs.versao_limpa }}
            ghcr.io/${{ github.repository_owner }}/ufla-shop:sha-${{ steps.versao.outputs.sha_curto }}
            ghcr.io/${{ github.repository_owner }}/ufla-shop:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar tag e Release no GitHub com notas geradas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.versao.outputs.versao_limpa }}-${{ steps.versao.outputs.sha_curto }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Release ${TAG}" \
              --generate-notes
          fi

  staging:
    name: Implantar em Staging (Docker Compose)
    needs: publicar
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Implantar stack completa com deploy.sh e validar healthchecks
        env:
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/ufla-shop
        run: |
          ./scripts/deploy.sh "${{ needs.publicar.outputs.versao }}"

      - name: Exibir logs caso algum servico falhe
        if: failure()
        run: docker compose logs

      - name: Encerrar ambiente efemero do runner
        if: always()
        run: docker compose down
